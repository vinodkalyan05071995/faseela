<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Faseela — Kitchen / Counter Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,500..700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  body.kds {
    background: #f2eee7;
    background-image:
      radial-gradient(1000px 600px at 85% -10%, rgba(114,62,30,.07), transparent 60%),
      radial-gradient(900px 500px at -5% 0%, rgba(20,147,114,.06), transparent 55%);
    color: #23180d; min-height: 100vh;
  }
  body.kds::after { opacity: .03; }
  .kbar {
    display: flex; align-items: center; gap: 18px;
    padding: 16px 26px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.88); backdrop-filter: saturate(160%) blur(10px);
  }
  .kbar .brand-mark { color: var(--pine); }
  .kbar h1 { font-size: 1.55rem; color: var(--espresso); font-family:"Anton",sans-serif; font-weight:400; letter-spacing:.02em; text-transform:uppercase; }
  .kbar h1 small { display:block; font-family:"Hanken Grotesk"; font-weight:600; font-size:.62rem; letter-spacing:.22em; text-transform:uppercase; color:var(--coffee-soft); margin-top:4px; }
  .live { display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.82rem; padding:7px 14px; border-radius:999px; background:var(--parchment-2); }
  .live .dot { width:9px; height:9px; border-radius:50%; background:#c8912f; box-shadow:0 0 0 0 rgba(200,145,47,.6); }
  .live.on .dot { background:#109070; animation:livepulse 2s infinite; }
  @keyframes livepulse { 0%{box-shadow:0 0 0 0 rgba(20,147,114,.5)} 70%{box-shadow:0 0 0 7px rgba(20,147,114,0)} 100%{box-shadow:0 0 0 0 rgba(20,147,114,0)} }
  .kbar .spacer { margin-left:auto; }
  .ktoggle { font-family:inherit; font-weight:700; font-size:.82rem; cursor:pointer; padding:8px 15px; border-radius:999px; border:1.5px solid var(--line); background:transparent; color:var(--espresso); }
  .ktoggle:hover { background:var(--parchment-2); }
  .kbar a.menu-link { color:var(--pine); font-weight:700; text-decoration:none; font-size:.86rem; }

  .board { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:22px 26px 60px; max-width:1500px; margin:0 auto; }
  .col { background:#fbf8f3; border:1px solid var(--line); border-radius:18px; padding:14px; min-height:60vh; }
  .col-head { display:flex; align-items:center; justify-content:space-between; padding:6px 8px 14px; }
  .col-head h2 { font-size:1.15rem; color:var(--espresso); letter-spacing:.02em; }
  .col-head .cnt { font-family:"Fraunces",serif; font-weight:600; font-size:1.4rem; min-width:34px; height:34px; padding:0 8px; display:grid; place-items:center; border-radius:10px; color:#fff; }
  .col.new   .col-head .cnt { background:#d99a2e; }
  .col.preparing .col-head .cnt { background:#b5541e; }
  .col.ready .col-head .cnt { background:#109070; }
  .col-body { display:flex; flex-direction:column; gap:13px; }

  .kcard { background:#fff; color:var(--espresso); border:1px solid var(--line); border-radius:14px; padding:15px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden; animation:pop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from{ opacity:0; transform:translateY(-8px) scale(.97);} to{opacity:1; transform:none;} }
  .kcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; }
  .kcard.new::before { background:#d99a2e; }
  .kcard.preparing::before { background:#b5541e; }
  .kcard.ready::before { background:#109070; }
  .kcard-top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .knum { font-family:"Fraunces",serif; font-weight:600; font-size:1.5rem; color:var(--pine); }
  .kwho { text-align:right; }
  .kwho .tag { display:inline-block; font-weight:800; font-size:.82rem; padding:4px 11px; border-radius:999px; letter-spacing:.01em; }
  .kwho .tag.table { background:#109070; color:#eafffb; }
  .kwho .tag.counter { background:#d4623c; color:#fff; }
  .kwho .nm { display:block; font-weight:700; font-size:1.02rem; margin-top:3px; }
  .kitems { list-style:none; margin:10px 0 12px; padding:0; }
  .kitems li { display:flex; gap:8px; padding:3px 0; font-size:.98rem; border-bottom:1px dashed var(--line); }
  .kitems li:last-child { border-bottom:none; }
  .kitems b { color:var(--rust); min-width:30px; }
  .kcard-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .ktime { font-size:.8rem; color:var(--coffee-soft); font-weight:600; }
  .ktime.late { color:var(--rust); }
  .adv { font-family:inherit; font-weight:800; font-size:.86rem; cursor:pointer; border:none; padding:10px 15px; border-radius:10px; background:var(--pine); color:#fff; transition:transform .14s, filter .2s; }
  .adv:hover { transform:translateY(-1px); filter:brightness(1.08); }
  .adv.ready { background:#109070; }
  .adv.done { background:#0e6f56; }
  .empty { text-align:center; color:var(--coffee-soft); font-style:italic; padding:30px 10px; font-family:"Fraunces",serif; }

  @media (max-width:900px){ .board{ grid-template-columns:1fr; } }
</style>
</head>
<body class="kds">

<header class="kbar">
  <a href="index.html" class="brand-link"><img class="brand-logo" src="logo.png" alt="Faseela" /></a>
  <h1>Kitchen &amp; Counter<small id="locName">Live Orders</small></h1>
  <span class="live" id="live"><span class="dot"></span><span id="liveText">Connecting…</span></span>
  <span class="spacer"></span>
  <button class="ktoggle" id="soundToggle">🔔 Sound: On</button>
  <a class="menu-link loc-link" href="cashier.html">Billing →</a>
  <a class="menu-link" href="admin.html">Products →</a>
  <a class="menu-link loc-link" href="qr-codes.html">QR codes →</a>
</header>

<main class="board">
  <section class="col new">
    <div class="col-head"><h2>New</h2><span class="cnt" id="count-new">0</span></div>
    <div class="col-body" id="col-new"></div>
  </section>
  <section class="col preparing">
    <div class="col-head"><h2>Preparing</h2><span class="cnt" id="count-preparing">0</span></div>
    <div class="col-body" id="col-preparing"></div>
  </section>
  <section class="col ready">
    <div class="col-head"><h2>Ready</h2><span class="cnt" id="count-ready">0</span></div>
    <div class="col-body" id="col-ready"></div>
  </section>
</main>

<script src="locations.js"></script>
<script src="loc-staff.js"></script>
<script src="kds.js"></script>
</body>
</html>
